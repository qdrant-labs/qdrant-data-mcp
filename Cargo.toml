[package]
name = "qdrant-data-mcp"
version = "1.20.0-server.3"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.9", features = ["server", "transport-io"] }
rmcp-actix-web = "0.13"
rmcp-openapi = { version = "0.32.2", features = ["authorization-token-passthrough"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
jsonwebtoken = { version = "11", features = ["aws_lc_rs", "use_pem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
