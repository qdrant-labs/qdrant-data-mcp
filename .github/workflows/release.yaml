name: Release

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: ')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write # to create the tag and GitHub release
      actions: write # to dispatch the Docker image build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # First line only, strip the "release: " prefix, trim whitespace
          first_line="${MSG%%$'\n'*}"
          version="${first_line#release: }"
          version="$(echo "$version" | xargs)"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-server\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$version' (expected vX.Y.Z-server.N)" >&2
            exit 1
          fi

          file_version="$(jq -r .version deno.json)"
          if [[ "v$file_version" != "$version" ]]; then
            echo "Version '$version' does not match deno.json ('$file_version')" >&2
            exit 1
          fi

          # A bare -server.N is a stable release; any further suffix (-rc.1) is a pre-release
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-server\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build binaries
        run: ./scripts/build.sh

      - name: Compress binaries and write checksums
        run: |
          gzip -9 dist/*
          cd dist && sha256sum * > checksums.txt

      - name: Create tag and GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generateReleaseNotes: true
          artifacts: "dist/*"

      - name: Dispatch Docker image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-image.yaml -f tag=${{ steps.version.outputs.version }}
