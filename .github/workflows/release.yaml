name: Release

on:
  push:
    branches: [main]

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: ')"
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # First line only, strip the "release: " prefix, trim whitespace
          first_line="${MSG%%$'\n'*}"
          version="${first_line#release: }"
          version="$(echo "$version" | xargs)"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-server\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$version' (expected vX.Y.Z-server.N)" >&2
            exit 1
          fi

          file_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "v$file_version" != "$version" ]]; then
            echo "Version '$version' does not match Cargo.toml ('$file_version')" >&2
            exit 1
          fi

          # A bare -server.N is a stable release; any further suffix (-rc.1) is a pre-release
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-server\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # Each binary builds natively on its own OS. The Linux ones use the oldest
  # runner images so they work on older glibc versions.
  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Compress
        shell: bash
        run: |
          mkdir dist
          gzip -9 -c "target/${{ matrix.target }}/release/qdrant-data-mcp${{ matrix.ext }}" \
            > "dist/qdrant-data-mcp-${{ matrix.target }}${{ matrix.ext }}.gz"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and GitHub release
      actions: write # to dispatch the Docker image build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Write checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create tag and GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generateReleaseNotes: true
          artifacts: "dist/*"

      - name: Dispatch Docker image build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docker-image.yaml -f tag=${{ needs.version.outputs.version }}
